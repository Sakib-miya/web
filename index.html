<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>छिट्टै आउँदैछ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;500&family=Rozha+One&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: light;
    --paper: #ffffff;
    --ink: #17214a;
    --muted: #5d6385;
    --crimson: #d41f3c;
    --track: #ecedf4;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); background: var(--paper); }
  body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--ink);
    font-family: "Mukta", "Noto Sans Devanagari", "Kohinoor Devanagari", "Mangal", sans-serif;
  }
  main {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2rem;
    padding: 2rem 1.5rem;
    text-align: center;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: .7rem;
    padding: .45rem 1.1rem .5rem;
    border: 1.5px solid var(--ink);
    border-radius: 999px;
    font-size: 1.15rem;
    font-weight: 500;
    line-height: 1.6;
  }
  .dot {
    width: .6rem;
    height: .6rem;
    border-radius: 50%;
    background: var(--crimson);
    animation: pulse 1.6s ease-in-out infinite;
  }
  h1 {
    margin: 0;
    font-family: "Rozha One", "Noto Serif Devanagari", "Kohinoor Devanagari", "Mangal", serif;
    font-weight: 400;
    font-size: clamp(3.4rem, 15vw, 9.5rem);
    line-height: 1.35;
    letter-spacing: 0;
    color: var(--ink);
  }
  .sub {
    margin: 0;
    max-width: 30ch;
    font-size: 1.2rem;
    line-height: 1.7;
    color: var(--muted);
  }
  .track {
    width: min(18rem, 70vw);
    height: 4px;
    border-radius: 4px;
    background: var(--track);
    overflow: hidden;
  }
  .track span {
    display: block;
    width: 38%;
    height: 100%;
    border-radius: 4px;
    background: var(--crimson);
    animation: slide 2.2s ease-in-out infinite alternate;
  }
  @keyframes slide { from { transform: translateX(-5%); } to { transform: translateX(163%); } }
  @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: .35; transform: scale(.7); } }
  @media (prefers-reduced-motion: reduce) {
    .dot, .track span { animation: none; }
    .track span { width: 60%; }
  }
</style>
</head>
<body>
<main>
  <div class="status" role="status"><span class="dot" aria-hidden="true"></span>परीक्षण जारी छ</div>
  <h1>छिट्टै आउँदैछ</h1>
  <p class="sub">कृपया केही समय पर्खनुहोस्।</p>
  <div class="track" aria-hidden="true"><span></span></div>
</main>
</body>
</html>
